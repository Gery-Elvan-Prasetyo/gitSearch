<body>
    <div class="container">
    <title>Website/s</title>
    <h1 id="header1">Github Repositories List</h1>
   <input type="text" id="username" placeholder=" GitHub username" text-size="20" style="text-align: center;">
    <button id="fetchButton" onclick="fetchRepositories()"><span class="button-text">Fetch Repositories</span></button>
    <ul id="repoList"></ul>
    </div>

    <script>
        async function fetchRepositories() {
            const username = document.getElementById('username').value;
            const response = await fetch(`https://api.github.com/users/${username}/repos`);
            const repos = await response.json();
            const repoList = document.getElementById('repoList');
            repoList.innerHTML = '';
            repos.forEach(repo => {
                const listItem = document.createElement('li');
                listItem.innerHTML = `<a href="${repo.html_url}" target="_blank"> ${repo.name}</a>`;
                repoList.appendChild(listItem);
            });
        }
    </script>
